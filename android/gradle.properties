# Sized down from Flutter's 8G default -- this machine has 16GB total RAM
# and effectively no pagefile, shared with the Android emulator (~2.5GB)
# and everything else running. Kotlin compiles in-process (rather than its
# own separate daemon JVM) and parallelism is off, to minimize the number
# of concurrent JVMs rather than maximize any single one's speed.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=false
org.gradle.workers.max=1
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
